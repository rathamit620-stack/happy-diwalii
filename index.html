<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Diwali ✨</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; overflow: hidden;
    display: grid; place-items: center;
    font-family: Georgia, "Times New Roman", serif;
    color: #fff5d6;
    background: radial-gradient(ellipse at 50% 65%, #7a250b 0%, #350b12 48%, #120710 100%);
  }
  .scene { width: min(94vw, 760px); text-align: center; padding: 24px 12px; }
  .intro { font-family: system-ui, sans-serif; letter-spacing: 2px; text-transform: uppercase; font-size: 12px; color: #ffd98b; }
  h1 { font-size: clamp(2rem, 7vw, 4rem); margin: 10px 0 22px; color: #ffdf91; text-shadow: 0 0 22px #ff8b25; }
  .door-frame {
    position: relative; width: min(68vw, 310px); height: min(78vw, 390px);
    margin: 0 auto 24px; padding: 12px;
    border: 9px solid #d78b32; border-bottom: 0;
    border-radius: 150px 150px 0 0;
    background: linear-gradient(90deg, #7a310e, #d78b32 50%, #7a310e);
    box-shadow: 0 0 28px #ff9c37aa, 0 0 80px #ff6a1b44;
    perspective: 900px;
  }
  .doorway {
    position: absolute; inset: 12px 12px 0;
    border-radius: 135px 135px 0 0;
    background: radial-gradient(ellipse at center, #fff1b5 0%, #ffb84c 28%, #8d2b0b 72%, #210b10 100%);
    overflow: hidden;
  }
  .door {
    position: absolute; inset: 0; transform-origin: left center;
    transition: transform 1.7s cubic-bezier(.2,.75,.15,1);
    background:
      radial-gradient(circle at 50% 17%, #e5a64b 0 4px, transparent 5px),
      repeating-linear-gradient(90deg, transparent 0 48px, #4b170b 49px 53px),
      linear-gradient(90deg, #8e3514, #c56b25 45%, #7b260f);
    border: 4px solid #f0b95e;
    box-shadow: inset 0 0 0 8px #6a210d, inset 0 0 25px #310d08;
  }
  .door::before { content: ""; position: absolute; inset: 18px; border: 2px solid #efbd69; border-radius: 115px 115px 8px 8px; }
  .door::after { content: "✦"; position: absolute; right: 22px; top: 52%; color: #ffdb7b; font-size: 25px; }
  .knob { position: absolute; right: 27px; top: 57%; width: 12px; height: 12px; border-radius: 50%; background: #ffd66c; box-shadow: 0 0 10px #fff1a0; }
  .opened .door { transform: rotateY(-112deg); }
  .opened .doorway { background: radial-gradient(ellipse at center, #fff9d8 0%, #ffd36b 25%, #ff8b28 53%, #7d230b 100%); }
  button {
    border: 1px solid #ffdf91; border-radius: 999px; padding: 14px 28px;
    color: #45150a; background: linear-gradient(135deg, #ffe6a0, #eaa33f);
    font-size: 16px; font-weight: 700; cursor: pointer;
    box-shadow: 0 6px 24px #ff9b2b55; transition: transform .2s;
  }
  button:hover { transform: translateY(-2px) scale(1.03); }
  .message { min-height: 112px; opacity: 0; transform: translateY(12px); transition: all 1s ease .7s; }
  .opened .message { opacity: 1; transform: translateY(0); }
  .message h2 { font-size: clamp(2rem, 8vw, 4.3rem); margin: 8px 0; color: #ffe6a0; text-shadow: 0 0 24px #ff9b2b; }
  .message p { margin: 0; font-family: system-ui, sans-serif; color: #ffe6c2; }
  .spark { position: fixed; width: 5px; height: 5px; border-radius: 50%; background: #ffe49a; box-shadow: 0 0 12px 3px #ff9c36; animation: float 4s linear infinite; opacity: .7; }
  @keyframes float { from { transform: translateY(20px) scale(.5); opacity: 0; } 20% { opacity: .9; } to { transform: translateY(-110vh) scale(1.2); opacity: 0; } }
  .hint { margin-top: 14px; color: #eebc7a; font: 12px system-ui, sans-serif; }
  .diya {
    position: absolute; z-index: 2; left: 50%; bottom: 24px;
    width: 118px; height: 76px; transform: translate(-50%, 18px) scale(.7);
    opacity: 0; transition: opacity 1s ease 1s, transform 1s ease 1s;
    filter: drop-shadow(0 0 18px #ff9d32);
  }
  .opened .diya { opacity: 1; transform: translate(-50%, 0) scale(1); }
  .diya-bowl {
    position: absolute; bottom: 0; left: 4px; width: 110px; height: 42px;
    border-radius: 8px 8px 58px 58px / 8px 8px 36px 36px;
    background: linear-gradient(180deg, #ffdb78, #c75a18 65%, #7c260e);
    border: 2px solid #ffd17a;
    box-shadow: inset 0 -8px 12px #78220d, 0 8px 20px #ff8b27aa;
  }
  .diya-bowl::before {
    content: ""; position: absolute; left: 4px; right: 4px; top: -5px;
    height: 12px; border-radius: 50%;
    background: linear-gradient(90deg, #8d2c0c, #ffd77c, #8d2c0c);
    border: 1px solid #ffe2a0;
  }
  .flame {
    position: absolute; left: 48px; top: -34px; width: 22px; height: 38px;
    border-radius: 55% 45% 55% 45%; transform: rotate(4deg);
    background: radial-gradient(ellipse at 50% 70%, #fffde0 0 16%, #fff09a 35%, #ff9b24 68%, #ff5b13 100%);
    box-shadow: 0 0 14px 7px #ffb52f88, 0 0 35px 15px #ff8c2380;
    transform-origin: 50% 100%; animation: flicker .8s ease-in-out infinite alternate;
  }
  @keyframes flicker {
    from { transform: rotate(-5deg) scale(.94, 1); }
    to { transform: rotate(6deg) scale(1.05, 1.08); }
  }
</style>
</head>
<body>
<div class="scene" id="scene">
  <div class="intro">A little surprise is waiting for you</div>
  <h1>✨ Something Special ✨</h1>
  <div class="door-frame">
    <div class="doorway">
      <div class="diya" aria-label="A glowing decorative diya">
        <span class="flame"></span>
        <span class="diya-bowl"></span>
      </div>
    </div>
    <div class="door"><span class="knob"></span></div>
  </div>
  <button id="openBtn">🚪 Open the Door</button>
  <div class="hint" id="hint">Tap the door to reveal your surprise</div>
  <div class="message" aria-live="polite">
    <h2>🪔 Happy Diwali! 🪔</h2>
    <p>Amit wishes you a very Happy Diwali! 🪔✨</p>
  </div>
</div>
<script>
  const scene = document.getElementById('scene');
  const button = document.getElementById('openBtn');
  const hint = document.getElementById('hint');
  function openDoor() {
    scene.classList.add('opened');
    button.textContent = '✨ Happy Diwali! ✨';
    button.disabled = true;
    hint.textContent = 'Wishing you a bright and beautiful Diwali!';
  }
  button.addEventListener('click', openDoor);
  document.querySelector('.door').addEventListener('click', openDoor);

  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span');
    s.className = 'spark';
    s.style.left = Math.random() * 100 + 'vw';
    s.style.bottom = (-Math.random() * 100) + 'px';
    s.style.animationDelay = (Math.random() * 4) + 's';
    s.style.animationDuration = (3 + Math.random() * 4) + 's';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
